name: CI/CD Microservice Deployment

on:
  push:
    branches: [ "main" ] # Triggers automatically when you push code to your main branch

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Sets up Java 21 to run a quick compile check to verify your code is completely valid
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Sets up Terraform CLI inside the runner pipeline environment
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # Runs validation checks inside your code and infrastructure folders
      - name: Terraform Init & Apply
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
